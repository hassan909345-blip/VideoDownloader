name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDK_MANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Check app launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            echo '' | base64 -d > /tmp/sample.mp4
            python3 -m http.server 8765 --directory /tmp --bind 0.0.0.0 > /tmp/video-server.log 2>&1 &
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.hassan.videodownloader/.MainActivity
            sleep 8
            adb shell pidof com.hassan.videodownloader
            adb shell am start -W -n com.hassan.videodownloader/.MainActivity -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT 'http://10.0.2.2:8765/sample.mp4'
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/window.xml
            python3 -c 'import xml.etree.ElementTree as E,re,subprocess; root=E.parse("/tmp/window.xml").getroot(); b=next(n.attrib["bounds"] for n in root.iter("node") if n.attrib.get("text")=="تحميل"); a=list(map(int,re.findall(r"[0-9]+",b))); subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)'
            for i in $(seq 1 60); do if adb shell ls /sdcard/Download/VideoDownloader/ 2>/dev/null | grep -q mp4; then echo 'Sample video downloaded and saved'; exit 0; fi; sleep 2; done; adb shell uiautomator dump /sdcard/window.xml; adb shell cat /sdcard/window.xml; adb logcat -d -t 200; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
